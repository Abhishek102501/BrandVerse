<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BrandVerse — discover, compare and follow the clothing brands worth your wardrobe."
    />
    <title>BrandVerse — Discover fashion brands worth following</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme before paint to avoid a flash of the wrong colour scheme -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('brandverse-theme');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || ((!theme || theme === 'system') && systemDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
